<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiet Ascent (Pty) Ltd</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #fafbfc;
      color: #1f2937;
      line-height: 1.7;
      scroll-behavior: smooth;
    }

    /* ===== COUNTDOWN ===== */
    #countdown-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.9s ease, visibility 0.9s;
    }

    #countdown-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .countdown-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 500;
      color: #1e3a5f;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .countdown-logo span {
      color: #b8860b;
    }

    .countdown-sub {
      font-size: 1.05rem;
      color: #6b7280;
      margin-bottom: 45px;
      font-weight: 300;
    }

    #countdown {
      font-size: 3.2rem;
      font-weight: 300;
      color: #1e3a5f;
      letter-spacing: 5px;
    }

    .countdown-labels {
      display: flex;
      gap: 36px;
      margin-top: 16px;
      font-size: 0.75rem;
      color: #9ca3af;
      letter-spacing: 1.5px;
    }

    /* ===== HEADER ===== */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 50px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 500;
      color: #1e3a5f;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: #b8860b;
    }

    nav a {
      margin-left: 32px;
      text-decoration: none;
      color: #4b5563;
      font-size: 0.95rem;
      font-weight: 400;
      transition: color 0.25s;
    }

    nav a:hover {
      color: #1e3a5f;
    }

    /* ===== HERO ===== */
    .hero {
      text-align: center;
      padding: 130px 20px 110px;
      background: linear-gradient(to bottom, #ffffff 0%, #f8fafc 100%);
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.4rem;
      color: #1e3a5f;
      margin-bottom: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .hero .tagline {
      font-size: 1.45rem;
      color: #4b5563;
      margin-bottom: 18px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .hero p {
      font-size: 1.1rem;
      color: #6b7280;
      max-width: 520px;
      margin: 0 auto 35px;
      font-weight: 300;
    }

    .badge {
      display: inline-block;
      background: #f1f5f9;
      color: #1e3a5f;
      padding: 10px 26px;
      border-radius: 50px;
      font-size: 0.9rem;
      border: 1px solid #e2e8f0;
      letter-spacing: 0.3px;
    }

    /* ===== SECTIONS ===== */
    section {
      max-width: 860px;
      margin: 0 auto;
      padding: 90px 30px;
    }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: #1e3a5f;
      margin-bottom: 24px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    p {
      color: #4b5563;
      font-size: 1.08rem;
      font-weight: 300;
    }

    /* ===== NOTICE ===== */
    .notice {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 32px 36px;
      margin: 40px auto 60px;
      max-width: 680px;
      text-align: center;
      color: #92400e;
      font-size: 1.02rem;
      line-height: 1.8;
    }

    /* ===== FOUNDER ===== */
    .founder-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 55px 40px;
      text-align: center;
      margin-top: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .founder-box h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: #1e3a5f;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .founder-box .role {
      color: #6b7280;
      font-size: 1.05rem;
      font-weight: 300;
    }

    /* ===== CONTACT ===== */
    .contact-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 50px 40px;
      text-align: center;
    }

    .contact-box a {
      color: #1e3a5f;
      text-decoration: none;
      font-weight: 400;
    }

    .contact-box a:hover {
      text-decoration: underline;
    }

    .socials {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .socials a {
      color: #4b5563;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 55px 20px;
      color: #9ca3af;
      font-size: 0.9rem;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      font-weight: 300;
    }

    @media (max-width: 700px) {
      .hero h1 { font-size: 2.5rem; }
      .hero .tagline { font-size: 1.25rem; }
      #countdown { font-size: 2.4rem; }
      header { padding: 16px 22px; }
      nav a { margin-left: 16px; font-size: 0.9rem; }
      .countdown-logo { font-size: 2.1rem; }
    }
  </style>
</head>
<body>

  <!-- COUNTDOWN -->
  <div id="countdown-screen">
    <div class="countdown-logo">Quiet <span>Ascent</span></div>
    <div class="countdown-sub">The future is in our hands</div>
    <div id="countdown
